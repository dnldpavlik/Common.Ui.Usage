[project]
name = "common-ui-usage"
version = "1.0.0"
description = "Scan HTML files for shared UI component usage patterns"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
common-ui-usage = "main:cli"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E", "W", # pycodestyle
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"test_main.py" = ["RUF012"]  # ClassVar annotations unnecessary in test classes

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
